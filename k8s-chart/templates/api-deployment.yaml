apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: food-delivery-api
  template:
    metadata:
      labels:
        app: food-delivery-api
    spec:
      containers:
      - name: api
        image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
        imagePullPolicy: IfNotPresent # Fundamental para o Kind usar a imagem local que carregamos
        ports:
        - containerPort: {{ .Values.api.port }}
        env:
        - name: SPRING_DATASOURCE_URL
          # Conectando no Service do banco de dados usando o DNS interno do cluster
          value: "jdbc:postgresql://food-delivery-db:5432/{{ .Values.database.dbName }}"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: food-delivery-secrets
              key: db-user
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: food-delivery-secrets
              key: db-password
        - name: SPRING_SQL_INIT_MODE
          value: "always"
        - name: SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION
          value: "true"

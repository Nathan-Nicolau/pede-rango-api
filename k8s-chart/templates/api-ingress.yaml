apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-delivery-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: food-delivery-api-service
            port:
              number: {{ .Values.api.port }}
  {{- if .Values.ingress.additionalHosts }}
  {{- range .Values.ingress.additionalHosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: food-delivery-api-service
            port:
              number: {{ $.Values.api.port }}
  {{- end }}
  {{- end }}

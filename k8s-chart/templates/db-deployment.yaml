apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-delivery-db
  template:
    metadata:
      labels:
        app: food-delivery-db
    spec:
      containers:
      - name: postgres
        # Concatenando a imagem e a tag do values.yaml
        image: "{{ .Values.database.image }}:{{ .Values.database.tag }}"
        ports:
        - containerPort: {{ .Values.database.port }}
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: food-delivery-secrets
              key: db-name
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: food-delivery-secrets
              key: db-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: food-delivery-secrets
              key: db-password
